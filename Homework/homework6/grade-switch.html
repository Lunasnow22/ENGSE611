<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hextech Grade Evaluator - Switch Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Beaufort+for+LoL:wght@700&family=Spiegel:wght@400;700&display=swap');

        body {
            background-color: #010a13;
            color: #f0e6d2;
            font-family: 'Spiegel', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle, #051923 0%, #010a13 100%);
        }

        .hextech-card {
            background: rgba(1, 10, 19, 0.95);
            border: 2px solid #785a28;
            padding: 40px;
            width: 450px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(120, 90, 40, 0.2);
            position: relative;
        }

        .hextech-card::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid #c8aa6e;
            pointer-events: none;
        }

        h1 {
            font-family: 'Beaufort for LoL', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #c8aa6e;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(200, 170, 110, 0.3);
        }

        .button-container {
            margin-bottom: 20px;
        }

        button {
            background: #1e2328;
            color: #cdbe91;
            border: 1px solid #785a28;
            padding: 15px 40px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: inset 0 0 5px rgba(120, 90, 40, 0.5);
        }

        button:hover {
            background: #cdbe91;
            color: #1e2328;
            box-shadow: 0 0 20px rgba(205, 190, 145, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        #outputBox {
            margin-top: 25px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #32281e;
            text-align: left;
            position: relative;
        }

        .result-line {
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(120, 90, 40, 0.1);
            padding-bottom: 5px;
        }

        .label { color: #a09b8c; text-transform: uppercase; font-size: 0.9rem; }

        .grade-big {
            font-size: 3rem;
            color: #00bcda;
            font-family: 'Beaufort for LoL', serif;
            text-align: center;
            display: block;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(0, 188, 218, 0.6);
        }

        .description {
            color: #c8aa6e;
            font-style: italic;
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
        }

        .status-pass { color: #0ac8b9; font-weight: bold; }
        .status-fail { color: #ef3f23; font-weight: bold; }
    </style>
</head>
<body>

    <div class="hextech-card">
        <h1>Hextech Evaluator</h1>
        
        <div class="button-container">
            <button onclick="runGradeSystem()">Run Code</button>
        </div>

        <div id="outputBox">
            <div style="text-align: center; color: #463d32;">Awaiting Input...</div>
        </div>
    </div>

    <script src="JavaScript/JavaScript.js"></script>
</body>
</html>
