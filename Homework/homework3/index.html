<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab CSS1 - League of Legends Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>League of Legends Champions</h1>

    <div class="card-container">
        <div class="card">
            <img src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Ahri_0.jpg" alt="Ahri">
            <h3>Ahri</h3>
            <p>จิ้งจอกเก้าหางผู้ใช้เวทมนตร์เสน่ห์และลูกไฟวิญญาณในการจัดการศัตรู</p>
        </div>

        <div class="card">
            <img src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Yasuo_0.jpg" alt="Yasuo">
            <h3>Yasuo</h3>
            <p>นักดาบพเนจรผู้ควบคุมสายลม รวดเร็วและรุนแรงด้วยคมดาบในพริบตา</p>
        </div>

        <div class="card">
            <img src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Jinx_0.jpg" alt="Jinx">
            <h3>Jinx</h3>
            <p>จอมทำลายล้างจากซอน มาพร้อมกับปืนกลและจรวดที่พร้อมจะระเบิดทุกอย่าง</p>
        </div>
    </div>
</body>

</html>
